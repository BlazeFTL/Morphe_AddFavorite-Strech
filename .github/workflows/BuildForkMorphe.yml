name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patcher
        uses: actions/checkout@v6
        with:
          path: patcher

      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/morphe-manager
          ref: dev
          path: source

      - name: Apply patches
        run: python3 patcher/patch.py source

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build release APK
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphe-manager-release
          path: source/app/build/outputs/apk/release/*.apk
