name: Build APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout patcher
        uses: actions/checkout@v6
        with:
          path: patcher

      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: MorpheApp/morphe-manager
          ref: dev
          path: source

      - name: Apply patches
        run: python3 patcher/patch.py source

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build release APK
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease

      - name: Extract version from changelog
        id: version
        run: |
          VERSION=$(head -n 1 source/CHANGELOG.md | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Stage single APK with fixed name
        run: |
          mkdir -p /tmp/out
          APK_PATH=$(find source/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in build output"
            exit 1
          fi
          cp "$APK_PATH" "/tmp/out/MorpheFork-V${{ steps.version.outputs.version }}.apk"
          echo "Staged to: /tmp/out/MorpheFork-V${{ steps.version.outputs.version }}.apk"

      - name: Upload raw APK (no zip)
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/out/MorpheFork-V${{ steps.version.outputs.version }}.apk
          archive: false

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MorpheFork V${{ steps.version.outputs.version }}
          files: /tmp/out/MorpheFork-V${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
